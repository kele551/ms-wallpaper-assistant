name: build

# 这个工作流只做一件事：在干净的 Windows runner 上，用仓库里的真实构建脚本
# 把成品打出来，并把 SHA256 打印+存档，证明"发布产物确实由本仓库源码构建"。
# 它不发布、不上传 Release、不签名（签名步骤见 docs/CODE_SIGNING_POLICY.md，用占位注释标出）。

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Windows 打包 + SHA256
    runs-on: windows-latest
    timeout-minutes: 30
    # 【2026-10-09 修】GitHub 的 Windows runner 控制台默认 cp1252，
    # 构建脚本里的中文 print 会抛 UnicodeEncodeError 直接把 CI 弄红。
    # 强制 Python 用 UTF-8 输出即可（本地因此从没复现过）。
    env:
      PYTHONIOENCODING: utf-8
      PYTHONUTF8: "1"

    steps:
      - name: 检出源码
        uses: actions/checkout@v4

      - name: 安装 Python
        uses: actions/setup-python@v5
        with:
          # 与本地打包环境一致：Python 3.13
          python-version: '3.13'

      - name: 安装 PyInstaller
        # 本项目打包**只需要 pyinstaller**，主程序与打包脚本都只用标准库
        run: python -m pip install --disable-pip-version-check "pyinstaller==6.22.3"

      - name: 打包（仓库里的真实构建脚本）
        # --release 会额外产出带版本号的 exe 与 ASCII 名 zip；脚本自己会先检查
        # core.ps1 / menu.ps1 是 UTF-8 带 BOM，缺 BOM 直接拒绝打包。
        run: python build-exe.py --release

      - name: 整理产物 + 生成 SHA256 清单
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path dist-staging | Out-Null
          Get-ChildItem -File -Filter *.exe | Copy-Item -Destination dist-staging
          Get-ChildItem -File -Filter *.zip | Copy-Item -Destination dist-staging
          $lines = foreach ($f in (Get-ChildItem -File dist-staging | Sort-Object Name)) {
            $h = (Get-FileHash -Algorithm SHA256 -LiteralPath $f.FullName).Hash
            '{0}  {1}  {2} bytes' -f $h, $f.Name, $f.Length
          }
          $lines | Set-Content -Encoding utf8 dist-staging\SHA256SUMS.txt
          Write-Host '===== SHA256 ====='
          $lines | ForEach-Object { Write-Host $_ }

      - name: 版本号自证
        shell: pwsh
        run: |
          $txt = Get-Content -Raw launcher.py
          if ($txt -match "VERSION\s*=\s*'([0-9.]+)'") {
            Write-Host ("源码 VERSION = " + $Matches[1])
            "源码 VERSION = $($Matches[1])" | Add-Content -Encoding utf8 dist-staging\SHA256SUMS.txt
          } else {
            throw '在 launcher.py 里找不到 VERSION 常量'
          }
          $vj = Get-Content -Raw version.json | ConvertFrom-Json
          Write-Host ("version.json = " + $vj.version)
          "version.json = $($vj.version)" | Add-Content -Encoding utf8 dist-staging\SHA256SUMS.txt
          if ($Matches[1] -ne $vj.version) {
            throw "launcher.py 的 VERSION（$($Matches[1])）与 version.json（$($vj.version)）不一致 —— 先对齐再发版"
          }
          # 【2026-10-26 修】成品名 2026-10-25 起跟着显示名走 —— build-exe.py 的 EXE_STEM
          # 是 '桌面壁纸'，这里还 Get-Item '壁纸助手.exe' 的话这一步直接 throw，CI 恒红。
          # 名字唯一来源是 launcher.py 的 EXE_STEM，别再在第二处写死。
          $exe = Get-Item '桌面壁纸.exe'
          $fv = "$($exe.VersionInfo.FileVersion)".Trim()
          $company = "$($exe.VersionInfo.CompanyName)".Trim()
          $comments = "$($exe.VersionInfo.Comments)".Trim()
          Write-Host ("exe 文件版本 = " + $fv)
          Write-Host ("exe 大小     = " + $exe.Length + " B")
          Write-Host ("CompanyName  = " + $company)
          Write-Host ("Comments     = " + $comments)

          # 2026-10-27：补齐闸门 —— 以前只打印不判断，版本/署名/仓库地址漂了也能过。
          # 仓库地址以 build-exe.py 的 APP_REPO 为唯一口径（和热点新闻同一套做法）。
          if (-not $fv.StartsWith($vj.version)) {
            throw "exe 文件版本（$fv）与 version.json（$($vj.version)）不一致"
          }
          if ($company -ne 'HaiFeng (kele551)') { throw "CompanyName 署名不对：$company" }
          $spec = Get-Content -Raw build-exe.py
          if ($spec -notmatch "APP_REPO\s*=\s*'([^']+)'") { throw 'build-exe.py 里找不到 APP_REPO' }
          $specRepo = $Matches[1]
          if ($specRepo -notmatch '^(gitcode|github|atomgit)\.com/kele551/ms-wallpaper-assistant$') {
            throw "build-exe.py 的 APP_REPO 不对（应为 kele551/ms-wallpaper-assistant 的 GitCode/GitHub/AtomGit 地址）：$specRepo"
          }
          if ($comments -ne $specRepo) {
            throw "exe 注释里的仓库地址（$comments）与 build-exe.py 的 APP_REPO（$specRepo）不一致"
          }
          "exe 文件版本 = $fv" | Add-Content -Encoding utf8 dist-staging\SHA256SUMS.txt

      # ── 代码签名占位 ───────────────────────────────────────────────
      # 本项目正在申请 SignPath Foundation 提供的免费代码签名（见 docs/CODE_SIGNING_POLICY.md）。
      # 通过之后，签名步骤插在这里：对 dist-staging 里的 exe 签名，**然后再**算上面那份 SHA256。
      # 现在没有签名，所以产物是未签名的 —— 请以 SHA256SUMS.txt 自行核对来源。

      - name: 上传产物
        uses: actions/upload-artifact@v4
        with:
          # 【2026-10-26】产物名里的「壁纸助手」是 2026-10-25 之前的旧成品名，现在成品叫
          # 桌面壁纸.exe。这里跟另外两个仓库(FoxPath-build-<sha> / hotnews-windows-<sha>)
          # 保持同一口径：ASCII 名 + commit sha，避免中文名在下载端被削。
          name: ms-wallpaper-assistant-build-${{ github.sha }}
          path: dist-staging/
          if-no-files-found: error
          retention-days: 30
